[project]
name = "contract-agent"
version = "0.1.0"
description = "Автономный агент-аналитик цепочек и кластеров договоров (Claude + tool use)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8,<2",
    "openai>=1.40",
    "pymupdf>=1.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
contract-agent = "contract_agent.cli:main"

[tool.setuptools]
packages = ["contract_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
